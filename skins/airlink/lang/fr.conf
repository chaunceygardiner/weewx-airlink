# skins/airlink/lang/fr.conf
#
# French -- Français.  The plot-period tabs (Jour, Semaine, Mois,
# Année) are copied verbatim from the French lang file of WeeWX's own
# Seasons skin (a test pins this).  Corrections welcome -- file an
# issue at
# https://github.com/chaunceygardiner/weewx-airlink/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Libelles : valeurs de la page et axe/legende des graphiques
        pm2_5_aqi = "Indice de qualité de l'air"
        pm1_0     = "PM1,0"
        pm2_5     = "PM2,5"
        pm10_0    = PM10

# Les unites " AQI" et " RGB" ne figurent volontairement PAS ici :
# airlink.py les enregistre globalement, WeeWX les lit de la et une entree
# dans ce fichier n'aurait aucun effet.  Ce sont de toute facon des sigles,
# laisses tels quels.

[ImageGenerator]

    [[year_images]]

        # jour/mois au lieu de l'ordre americain mois/jour
        x_label_format = %d/%m

[Texts]

    # The page heading and the browser title: the station's own name,
    # from [Station] location in weewx.conf.  Translate the whole
    # phrase, preposition and all -- {location} may sit anywhere in it.
    "{location} Air Quality" = "Qualité de l'air à {location}"
    "Air Quality" = "Qualité de l'air"
    "Unavailable" = "Indisponible"

    # Titres des cartes
    "Right now" = "En ce moment"
    "The last 24 hours, hour by hour" = "Les dernières 24 heures, heure par heure"
    "History" = "Historique"

    # Tuiles
    "Today's peak" = "Maximum du jour"
    "Today's average" = "Moyenne du jour"
    "Today's low" = "Minimum du jour"
    "Hours above Good" = "Heures au-dessus de Bon"
    "in the last 24 hours" = "sur les dernières 24 heures"

    # Les six categories d'AQI de l'EPA americaine, par ordre croissant
    "Good" = "Bon"
    "Moderate" = "Moyen"
    "Unhealthy for Sensitive Groups" = "Mauvais pour les groupes sensibles"
    "Unhealthy" = "Mauvais"
    "Very Unhealthy" = "Très mauvais"
    "Hazardous" = "Dangereux"

    # Une phrase sanitaire par categorie, dans le meme ordre
    "Air quality is satisfactory, and air pollution poses little or no risk." = "La qualité de l'air est satisfaisante ; la pollution présente peu ou pas de risque."
    "Acceptable.  Unusually sensitive people should consider limiting prolonged outdoor exertion." = "Acceptable.  Les personnes particulièrement sensibles devraient limiter les efforts prolongés en extérieur."
    "Sensitive groups may experience health effects.  The general public is less likely to be affected." = "Les groupes sensibles peuvent ressentir des effets sur la santé.  Le grand public est moins susceptible d'être affecté."
    "Some members of the general public may experience health effects." = "Certaines personnes du grand public peuvent ressentir des effets sur la santé."
    "Health alert: the risk of health effects is increased for everyone." = "Alerte sanitaire : le risque d'effets sur la santé est accru pour tout le monde."
    "Health warning of emergency conditions: everyone is more likely to be affected." = "Alerte sanitaire, conditions d'urgence : tout le monde risque davantage d'être affecté."

    # Periodes des graphiques, comme dans le skin Seasons de WeeWX
    "Day" = "Jour"
    "Week" = "Semaine"
    "Month" = "Mois"
    "Year" = "Année"
