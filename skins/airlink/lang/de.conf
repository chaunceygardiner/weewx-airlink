# skins/airlink/lang/de.conf
#
# German -- Deutsch.  The plot-period tabs (Tag, Woche, Monat, Jahr)
# are copied verbatim from the German lang file of WeeWX's own Seasons
# skin (a test pins this).  Corrections welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airlink/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Beschriftungen: Seitenwerte und y-Achse/Legende der Diagramme
        pm2_5_aqi = Luftqualitätsindex
        pm1_0     = "PM1,0"
        pm2_5     = "PM2,5"
        pm10_0    = PM10

# Die Einheiten " AQI" und " RGB" stehen absichtlich NICHT hier:
# airlink.py registriert sie global, WeeWX liest sie von dort, und ein
# Eintrag in dieser Datei haette keine Wirkung.  Beide sind ohnehin
# Abkuerzungen und bleiben unuebersetzt.

[ImageGenerator]

    [[year_images]]

        # Tag.Monat statt der US-Reihenfolge Monat/Tag
        x_label_format = %d.%m.

[Texts]

    # The page heading and the browser title: the station's own name,
    # from [Station] location in weewx.conf.  Translate the whole
    # phrase, preposition and all -- {location} may sit anywhere in it.
    "{location} Air Quality" = "Luftqualität in {location}"
    "Air Quality" = "Luftqualität"
    "Unavailable" = "Nicht verfügbar"

    # Kartenueberschriften
    "Right now" = "Gerade jetzt"
    "The last 24 hours, hour by hour" = "Die letzten 24 Stunden, Stunde für Stunde"
    "History" = "Diagramme"

    # Kacheln
    "Today's peak" = "Heutiger Höchstwert"
    "Today's average" = "Heutiger Durchschnitt"
    "Today's low" = "Heutiger Tiefstwert"
    "Hours above Good" = "Stunden über Gut"
    "in the last 24 hours" = "in den letzten 24 Stunden"

    # Die sechs AQI-Kategorien der US-Umweltbehoerde, aufsteigend
    "Good" = "Gut"
    "Moderate" = "Mäßig"
    "Unhealthy for Sensitive Groups" = "Ungesund für empfindliche Gruppen"
    "Unhealthy" = "Ungesund"
    "Very Unhealthy" = "Sehr ungesund"
    "Hazardous" = "Gefährlich"

    # Je ein Gesundheitshinweis pro Kategorie, in derselben Reihenfolge
    "Air quality is satisfactory, and air pollution poses little or no risk." = "Die Luftqualität ist zufriedenstellend, die Luftverschmutzung stellt kaum ein Risiko dar."
    "Acceptable.  Unusually sensitive people should consider limiting prolonged outdoor exertion." = "Akzeptabel.  Besonders empfindliche Personen sollten längere Anstrengung im Freien einschränken."
    "Sensitive groups may experience health effects.  The general public is less likely to be affected." = "Empfindliche Gruppen können gesundheitliche Beschwerden bekommen.  Die Allgemeinbevölkerung ist weniger betroffen."
    "Some members of the general public may experience health effects." = "Einzelne Personen der Allgemeinbevölkerung können gesundheitliche Beschwerden bekommen."
    "Health alert: the risk of health effects is increased for everyone." = "Gesundheitswarnung: Für alle besteht ein erhöhtes Risiko gesundheitlicher Beschwerden."
    "Health warning of emergency conditions: everyone is more likely to be affected." = "Gesundheitswarnung bei Notfallbedingungen: Alle sind mit höherer Wahrscheinlichkeit betroffen."

    # Diagramm-Zeitraeume, wie im Seasons-Skin von WeeWX
    "Day" = "Tag"
    "Week" = "Woche"
    "Month" = "Monat"
    "Year" = "Jahr"
