# skins/airlink/lang/es.conf
#
# Spanish -- Español.  The plot-period tabs (Día, Semana, Mes, Año)
# are copied verbatim from the Spanish lang file of WeeWX's own Seasons
# skin (a test pins this).  Corrections welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airlink/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Etiquetas: valores de la pagina y eje/leyenda de las graficas
        pm2_5_aqi = Índice de calidad del aire
        pm1_0     = "PM1,0"
        pm2_5     = "PM2,5"
        pm10_0    = PM10

# Las unidades " AQI" y " RGB" NO estan aqui a proposito: airlink.py
# las registra globalmente, WeeWX las lee de alli y una entrada en este
# fichero no tendria ningun efecto.  Ademas son siglas y quedan sin
# traducir.

[ImageGenerator]

    [[year_images]]

        # dia/mes en lugar del orden estadounidense mes/dia
        x_label_format = %d/%m

[Texts]

    # The page heading and the browser title: the station's own name,
    # from [Station] location in weewx.conf.  Translate the whole
    # phrase, preposition and all -- {location} may sit anywhere in it.
    "{location} Air Quality" = "Calidad del aire en {location}"
    "Air Quality" = "Calidad del aire"
    "Unavailable" = "No disponible"

    # Cabeceras de las tarjetas
    "Right now" = "Ahora mismo"
    "The last 24 hours, hour by hour" = "Las últimas 24 horas, hora a hora"
    "History" = "Historia"

    # Indicadores
    "Today's peak" = "Máximo de hoy"
    "Today's average" = "Media de hoy"
    "Today's low" = "Mínimo de hoy"
    "Hours above Good" = "Horas por encima de Buena"
    "in the last 24 hours" = "en las últimas 24 horas"

    # Las seis categorias del AQI de la EPA estadounidense, de menor a mayor
    "Good" = "Buena"
    "Moderate" = "Moderada"
    "Unhealthy for Sensitive Groups" = "Insalubre para grupos sensibles"
    "Unhealthy" = "Insalubre"
    "Very Unhealthy" = "Muy insalubre"
    "Hazardous" = "Peligrosa"

    # Una frase sanitaria por categoria, en el mismo orden
    "Air quality is satisfactory, and air pollution poses little or no risk." = "La calidad del aire es satisfactoria y la contaminación supone poco o ningún riesgo."
    "Acceptable.  Unusually sensitive people should consider limiting prolonged outdoor exertion." = "Aceptable.  Las personas especialmente sensibles deberían limitar el esfuerzo prolongado al aire libre."
    "Sensitive groups may experience health effects.  The general public is less likely to be affected." = "Los grupos sensibles pueden sufrir efectos en la salud.  Es menos probable que el público general se vea afectado."
    "Some members of the general public may experience health effects." = "Algunas personas del público general pueden sufrir efectos en la salud."
    "Health alert: the risk of health effects is increased for everyone." = "Alerta sanitaria: el riesgo de efectos en la salud aumenta para todos."
    "Health warning of emergency conditions: everyone is more likely to be affected." = "Aviso sanitario de condiciones de emergencia: es más probable que todos se vean afectados."

    # Periodos de las graficas, como en el skin Seasons de WeeWX
    "Day" = "Día"
    "Week" = "Semana"
    "Month" = "Mes"
    "Year" = "Año"
