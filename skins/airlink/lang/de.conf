# skins/airlink/lang/de.conf
#
# German -- Deutsch.  The plot-period tabs (Tag, Woche, Monat, Jahr)
# are copied verbatim from the German lang file of WeeWX's own Seasons
# skin (a test pins this).  Corrections welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airlink/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Beschriftungen: Seitenkopf und y-Achse/Legende der Diagramme
        pm2_5_aqi = Luftqualitätsindex
        pm2_5     = "PM2,5"

# Die Einheiten " AQI" und " RGB" stehen absichtlich NICHT hier:
# airlink.py registriert sie global, WeeWX liest sie von dort, und ein
# Eintrag in dieser Datei haette keine Wirkung.  Beide sind ohnehin
# Abkuerzungen und bleiben unuebersetzt.

[ImageGenerator]

    [[year_images]]

        # Tag.Monat statt der US-Reihenfolge Monat/Tag
        x_label_format = %d.%m.

[Texts]

    "weewx-airlink demo page" = "weewx-airlink-Demoseite"
    "WeeWX-AirLink Demo Page" = "WeeWX-AirLink-Demoseite"
    "Unavailable" = "Nicht verfügbar"

    # Diagramm-Zeitraeume, wie im Seasons-Skin von WeeWX
    "Day" = "Tag"
    "Week" = "Woche"
    "Month" = "Monat"
    "Year" = "Jahr"
