# skins/airlink/lang/en.conf
#
# English -- the sample report's reference dictionary.  Every string the
# page renders is here, and nothing else: tests/test_airlink.py fails if
# a string rendered by index.html.tmpl is missing from this file, or if
# this file carries a string nothing renders.  The [Labels] entries
# have their ONLY home here -- skin.conf deliberately repeats none of them,
# so that a lang set in skin.conf cannot shadow its own translation.
#
# Translations are gettext-style: the English string IS the key, and a
# report falls back to the English, one string at a time, for any key
# its language file does not carry -- a partial translation is fine.

[Labels]

    [[Generic]]

        # Observation labels: the page's readouts, and the y-axis/legend
        # label of the PNG plots.
        pm2_5_aqi = Air Quality Index
        pm1_0     = PM1.0
        pm2_5     = PM2.5
        pm10_0    = PM10

# The " AQI" and " RGB" unit labels are deliberately NOT here.
# airlink.py registers them in WeeWX's process-global
# default_unit_label_dict, which Formatter consults ahead of any skin or
# lang setting, so a [Units] [[Labels]] entry for them could never take
# effect.  Both are acronyms and stay untranslated anyway.

[ImageGenerator]

    [[year_images]]

        # Restates skin.conf's default so that a report set back to
        # lang = en under a non-English [[Defaults]] lang gets the US
        # month/day order back; the other lang files each override it.
        x_label_format = %m/%d

[Texts]

    # ── page strings (index.html.tmpl) ───────────────────────────────
    # The page heading and the browser title: the station's own name,
    # from [Station] location in weewx.conf.  Translate the whole
    # phrase, preposition and all -- {location} may sit anywhere in it.
    "{location} Air Quality" = "{location} Air Quality"
    "Air Quality" = "Air Quality"
    "Unavailable" = "Unavailable"

    # Card headings
    "Right now" = "Right now"
    "The last 24 hours, hour by hour" = "The last 24 hours, hour by hour"
    "History" = "History"

    # Stat tiles
    "Today's peak" = "Today's peak"
    "Today's average" = "Today's average"
    "Today's low" = "Today's low"
    "Hours above Good" = "Hours above Good"
    "in the last 24 hours" = "in the last 24 hours"

    # The six US EPA AQI categories, lowest first.  These name the bands
    # of the dial and label the current reading.
    "Good" = "Good"
    "Moderate" = "Moderate"
    "Unhealthy for Sensitive Groups" = "Unhealthy for Sensitive Groups"
    "Unhealthy" = "Unhealthy"
    "Very Unhealthy" = "Very Unhealthy"
    "Hazardous" = "Hazardous"

    # One health sentence per category, in the same order.  These are the
    # US EPA's own AirNow category descriptions.
    "Air quality is satisfactory, and air pollution poses little or no risk." = "Air quality is satisfactory, and air pollution poses little or no risk."
    "Acceptable.  Unusually sensitive people should consider limiting prolonged outdoor exertion." = "Acceptable.  Unusually sensitive people should consider limiting prolonged outdoor exertion."
    "Sensitive groups may experience health effects.  The general public is less likely to be affected." = "Sensitive groups may experience health effects.  The general public is less likely to be affected."
    "Some members of the general public may experience health effects." = "Some members of the general public may experience health effects."
    "Health alert: the risk of health effects is increased for everyone." = "Health alert: the risk of health effects is increased for everyone."
    "Health warning of emergency conditions: everyone is more likely to be affected." = "Health warning of emergency conditions: everyone is more likely to be affected."

    # Plot-period tabs, as in WeeWX's own Seasons skin
    "Day" = "Day"
    "Week" = "Week"
    "Month" = "Month"
    "Year" = "Year"
