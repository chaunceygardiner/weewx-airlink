# skins/airlink/lang/nl.conf
#
# Dutch -- Nederlands.  The plot-period tabs (Dag, Week, Maand, Jaar)
# are copied verbatim from the Dutch lang file of WeeWX's own Seasons
# skin (a test pins this).  Corrections welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airlink/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Labels: paginakop en as/legenda van de grafieken
        pm2_5_aqi = Luchtkwaliteitsindex
        pm2_5     = "PM2,5"

# De eenheden " AQI" en " RGB" staan hier bewust NIET: airlink.py
# registreert ze globaal, WeeWX leest ze daarvandaan, en een regel in dit
# bestand zou geen effect hebben.  Het zijn sowieso afkortingen en blijven
# onvertaald.

[ImageGenerator]

    [[year_images]]

        # dag-maand in plaats van de Amerikaanse volgorde maand/dag
        x_label_format = %d-%m

[Texts]

    "weewx-airlink demo page" = "weewx-airlink-demopagina"
    "WeeWX-AirLink Demo Page" = "WeeWX-AirLink-demopagina"
    "Unavailable" = "Niet beschikbaar"

    # Grafiekperioden, zoals in de Seasons-skin van WeeWX
    "Day" = "Dag"
    "Week" = "Week"
    "Month" = "Maand"
    "Year" = "Jaar"
