# skins/airlink/lang/nl.conf
#
# Dutch -- Nederlands.  The plot-period tabs (Dag, Week, Maand, Jaar)
# are copied verbatim from the Dutch lang file of WeeWX's own Seasons
# skin (a test pins this).  Corrections welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airlink/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Labels: paginawaarden en as/legenda van de grafieken
        pm2_5_aqi = Luchtkwaliteitsindex
        pm1_0     = "PM1,0"
        pm2_5     = "PM2,5"
        pm10_0    = PM10

# De eenheden " AQI" en " RGB" staan hier bewust NIET: airlink.py
# registreert ze globaal, WeeWX leest ze daarvandaan, en een regel in dit
# bestand zou geen effect hebben.  Het zijn sowieso afkortingen en blijven
# onvertaald.

[ImageGenerator]

    [[year_images]]

        # dag-maand in plaats van de Amerikaanse volgorde maand/dag
        x_label_format = %d-%m

[Texts]

    # The page heading and the browser title: the station's own name,
    # from [Station] location in weewx.conf.  Translate the whole
    # phrase, preposition and all -- {location} may sit anywhere in it.
    "{location} Air Quality" = "Luchtkwaliteit in {location}"
    "Air Quality" = "Luchtkwaliteit"
    "Unavailable" = "Niet beschikbaar"

    # Kaartkoppen
    "Right now" = "Op dit moment"
    "The last 24 hours, hour by hour" = "De afgelopen 24 uur, uur voor uur"
    "History" = "Historie"

    # Tegels
    "Today's peak" = "Hoogste vandaag"
    "Today's average" = "Gemiddelde vandaag"
    "Today's low" = "Laagste vandaag"
    "Hours above Good" = "Uren boven Goed"
    "in the last 24 hours" = "in de afgelopen 24 uur"

    # De zes AQI-categorieen van de Amerikaanse EPA, oplopend
    "Good" = "Goed"
    "Moderate" = "Matig"
    "Unhealthy for Sensitive Groups" = "Ongezond voor gevoelige groepen"
    "Unhealthy" = "Ongezond"
    "Very Unhealthy" = "Zeer ongezond"
    "Hazardous" = "Gevaarlijk"

    # Een gezondheidszin per categorie, in dezelfde volgorde
    "Air quality is satisfactory, and air pollution poses little or no risk." = "De luchtkwaliteit is goed; luchtverontreiniging vormt weinig tot geen risico."
    "Acceptable.  Unusually sensitive people should consider limiting prolonged outdoor exertion." = "Aanvaardbaar.  Bijzonder gevoelige mensen kunnen langdurige inspanning buiten beter beperken."
    "Sensitive groups may experience health effects.  The general public is less likely to be affected." = "Gevoelige groepen kunnen gezondheidsklachten krijgen.  Het algemene publiek wordt minder snel getroffen."
    "Some members of the general public may experience health effects." = "Sommige mensen uit het algemene publiek kunnen gezondheidsklachten krijgen."
    "Health alert: the risk of health effects is increased for everyone." = "Gezondheidswaarschuwing: het risico op gezondheidsklachten is voor iedereen verhoogd."
    "Health warning of emergency conditions: everyone is more likely to be affected." = "Gezondheidswaarschuwing bij noodomstandigheden: iedereen wordt eerder getroffen."

    # Grafiekperioden, zoals in de Seasons-skin van WeeWX
    "Day" = "Dag"
    "Week" = "Week"
    "Month" = "Maand"
    "Year" = "Jaar"
