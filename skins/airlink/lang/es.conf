# skins/airlink/lang/es.conf
#
# Spanish -- Español.  The plot-period tabs (Día, Semana, Mes, Año)
# are copied verbatim from the Spanish lang file of WeeWX's own Seasons
# skin (a test pins this).  Corrections welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airlink/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Etiquetas: cabecera de la pagina y eje/leyenda de las graficas
        pm2_5_aqi = Índice de calidad del aire
        pm2_5     = "PM2,5"

# Las unidades " AQI" y " RGB" NO estan aqui a proposito: airlink.py
# las registra globalmente, WeeWX las lee de alli y una entrada en este
# fichero no tendria ningun efecto.  Ademas son siglas y quedan sin
# traducir.

[ImageGenerator]

    [[year_images]]

        # dia/mes en lugar del orden estadounidense mes/dia
        x_label_format = %d/%m

[Texts]

    "weewx-airlink demo page" = "página de demostración de weewx-airlink"
    "WeeWX-AirLink Demo Page" = "Página de demostración de WeeWX-AirLink"
    "Unavailable" = "No disponible"

    # Periodos de las graficas, como en el skin Seasons de WeeWX
    "Day" = "Día"
    "Week" = "Semana"
    "Month" = "Mes"
    "Year" = "Año"
